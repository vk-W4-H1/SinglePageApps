<!DOCTYPE html>
<html lang="en">
<head>
    <title>Test Automation ROI Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="pdfContent">
<h2>Test Automation ROI Calculator</h2>
<div hidden>
<label>Number of Test Cycles per Year:</label><input type="number" id="testCycles" value="12"><br>
<label>Hourly Rate ($):</label><input type="number" id="hourlyRate" value="50"><br/>
<label>Number of Years:</label><input type="number" id="numYears" value="1" min="1" oninput="calculateROI()"><br/>
</div>
<label id="lbl_BreakEven">Break Even at cycle</label><input type="number"  hidden id="BreakEven" value="0"><br/>
<label id="lbl_ROI">ROI (%)</label><input type="number" hidden id="ROI" value="0"><br/>
<button onclick="calculateROI()">Calculate ROI</button>
<button onclick="downloadAsPDF()">Download as PDF</button>
<button onclick="toggleGrid()">Toggle Grid Lines</button>
<button onclick="calculateBreakEven()">Calculate Break Even</button><br/>
<button onclick="exportCSV()">Export CSV</button>

<button onclick="document.getElementById('csvFile').click()">
    Import CSV
</button>
<input type="file" id="csvFile" accept=".csv" hidden onchange="importCSV(event)">


<h3>Manual Test Execution Time</h3>
<table id="manualCostTable">
    <thead><tr><th>Title</th><th>Hours</th><th>Rate in $</th><th>Total Cost</th><th>Other Cost</th><th>Actions</th></tr></thead>
    <tbody></tbody>
</table>
<button class="add-row-btn" onclick="addRow('manualCostTable', 'manual')">Add Row</button>

<h3>Execution Cost Post Automation</h3>
<table id="executionCostTable">
    <thead><tr><th>Title</th><th>Hours</th><th>Rate in $</th><th>Total Cost</th><th>Other Cost</th><th>Actions</th></tr></thead>
    <tbody></tbody>
</table>
<button class="add-row-btn" onclick="addRow('executionCostTable', 'postAutomation')">Add Row</button>

<h3>Automation Development Costs (One-time)</h3>
<table id="devCostTable">
    <thead><tr><th>Title</th><th>Hours</th><th>Rate in $</th><th>Total Cost</th><th>Other Cost</th><th>Actions</th></tr></thead>
    <tbody></tbody>
</table>
<button class="add-row-btn" onclick="addRow('devCostTable', 'dev')">Add Row</button>

<div class="resize-container"><canvas id="roiChart"></canvas></div>

<script>
let roiChart = null;
let showGrid = true;

function calculateROI() {
    const years = parseInt(document.getElementById('numYears').value, 10);
    const testCyclesPerYear = parseInt(document.getElementById('testCycles').value, 10);

    const totalCycles = years * testCyclesPerYear;

    const manualCostPerCycle = calculateTotalCost('manualCostTable');
    const postAutomationCostPerCycle = calculateTotalCost('executionCostTable');
    const automationDevCost = calculateTotalCost('devCostTable');
    const Break_even_Cycles = automationDevCost / (manualCostPerCycle-postAutomationCostPerCycle);
    let cumulativeManual = [];
    let cumulativePostAutomation = [];
    let savings = [];
    let roi = [];
    let automationCost = [];
    
    let breakEvenPoint = new Array(totalCycles).fill(null);
    breakEvenPoint[Break_even_Cycles]=10
    let breakevenset=false
    let manualTotal = 0;
    let postAutoTotal = 0;

    for (let cycle = 1; cycle <= totalCycles; cycle++) {
        manualTotal += manualCostPerCycle;
        postAutoTotal += postAutomationCostPerCycle;

        cumulativeManual.push(manualTotal);
        cumulativePostAutomation.push(postAutoTotal+automationDevCost);

        const currentSavings = manualTotal - postAutoTotal;
        savings.push(currentSavings);

        

        // Flat automation cost line
        automationCost.push(automationDevCost);

        roi.push(currentSavings - automationDevCost);

        // if((currentSavings - automationDevCost)>=0 &&  breakevenset==false)
        // {
            
        //     breakEvenPoint[cycle]=Break_even_Cycles
        //     breakevenset==true
        // }

    }

    drawChart(
        savings,
        roi,
        cumulativeManual,
        cumulativePostAutomation,
        automationCost,
        breakEvenPoint,
        totalCycles
    );
}

function calculateTotalCost(tableId) {
    let total = 0;
    document.querySelectorAll(`#${tableId} tbody tr`).forEach(row => {
        const hours = parseFloat(row.querySelector('.hours').value) || 0;
        const rate = parseFloat(row.querySelector('.rate').value) || 0;
        const otherCost = parseFloat(row.querySelector('.otherCost').value) || 0;
        const cost = (hours * rate) + otherCost;
        row.querySelector('.calc').innerText = cost.toFixed(2);
        total += cost;
    });
    return total;
}

function drawChart(savings, roi, manualCost, postAutomationCost, automationCost, breakEvenPoint,totalCycles) {
    const testCyclesPerYear = parseInt(document.getElementById('testCycles').value, 10);

    const labels = Array.from({ length: totalCycles }, (_, i) => {
        const year = Math.floor(i / testCyclesPerYear) + 1;
        const cycle = (i % testCyclesPerYear) + 1;
        return `Cycle ${cycle} (Year ${year})`;
    });

    if (roiChart) roiChart.destroy();

    roiChart = new Chart(document.getElementById('roiChart').getContext('2d'), {
        type: 'line',
        data: {
            labels,
            datasets: [
                {
                    label: 'Cumulative Savings ($) (per year)',
                    data: savings,
                    borderColor: 'green',
                    fill: false
                },
                {
                    label: 'Cumulative ROI ($) (per year)',
                    data: roi,
                    borderColor: 'blue',
                    fill: false
                },
                {
                    label: 'Manual Execution Cost (Cumulative) (per year)',
                    data: manualCost,
                    borderColor: 'red',
                    fill: false
                },
                {
                    label: 'Post Automation Execution Cost (Cumulative) (per year)',
                    data: postAutomationCost,
                    borderColor: 'orange',
                    fill: false
                },
                {
                    label: 'One-time Automation Cost (per year)',
                    data: automationCost,
                    borderColor: 'purple',
                    fill: false
                },
                {
    label: 'Break Even',
    data: breakEvenPoint,
    showLine: false,
    pointStyle: 'star',
    pointRadius: 12,
    pointHoverRadius: 14,
    pointBackgroundColor: 'red',
    pointBorderColor: 'white',
    pointBorderWidth: 2,
    // borderColor: 'white',
}
            ]
        },
        options: {
    responsive: true,
    maintainAspectRatio: false,
    interaction: {
        mode: 'index',
        intersect: false
    },
    scales: {
    x: {
        grid: {
            display: showGrid,
            drawBorder: true,
            color: 'rgba(255, 0, 0, 0.15)',   // visible but subtle
            lineWidth: 1
        }
    },
    y: {
        beginAtZero: true,
        grid: {
            display: showGrid,
            drawBorder: true,
            color: 'rgba(255, 0, 0, 0.15)',   // visible but subtle
            lineWidth: 1
        }
    }
}

}

    });
}



function addRow(tableId, type, title="") {
    const table = document.getElementById(tableId).getElementsByTagName('tbody')[0];
    const row = table.insertRow();
    if(title=="")
    {
    row.innerHTML = `
        <td><label >${type === 'manual' ? 'Manual Test' : type === 'postAutomation' ? 'Post Automation Test' : 'Automation Dev'} </label></td>
        <td><input type="number" class="hours" value="0" oninput="calculateROI()" ></td>
        <td><input type="number" class="rate" value="0" oninput="calculateROI()" ></td>
        <td><span class="calc">0</span></td>
        <td><input type="number" class="otherCost" value="0" oninput="calculateROI()"></td>
        <td><button onclick="removeRow(this)">Remove</button></td>
    `;}
    else
    {
        row.innerHTML = `
        <!--<td><label>${title}</label></td>-->
        <td><label  >${title}</label></td>
        <td><input type="number" class="hours" value="0" oninput="calculateROI()"></td>
        <td><input type="number" class="rate" value="0" oninput="calculateROI()"></td>
        <td><span class="calc">0</span></td>
        <td><input type="number" class="otherCost" value="0" oninput="calculateROI()"></td>
        <td><button onclick="removeRow(this)">Remove</button></td>
    `;
    }
    calculateROI();
}

function removeRow(button) {
    button.closest('tr').remove();
    calculateROI();
}

function downloadAsPDF() {

window.print();
}

function toggleGrid() {
    showGrid = !showGrid;
    calculateROI(); // re-render chart with updated grid setting
}

function calculateBreakEven()
{
    const manualCostPerCycle = calculateTotalCost('manualCostTable');
    const postAutomationCostPerCycle = calculateTotalCost('executionCostTable');
    const automationDevCost = calculateTotalCost('devCostTable');
    Break_even_Cycles = automationDevCost / (manualCostPerCycle-postAutomationCostPerCycle);
    document.querySelector('#BreakEven').value = Break_even_Cycles;
    document.querySelector('#lbl_BreakEven').innerText = "Break Even at cycle : "+  Break_even_Cycles;
}

function exportCSV() {
    const tables = [
        { id: "manualCostTable", name: "Manual Cost" },
        { id: "executionCostTable", name: "Execution Cost" },
        { id: "devCostTable", name: "Development Cost" }
    ];

    let csv = [];

    tables.forEach(tableInfo => {
        csv.push(`#${tableInfo.name}`);
        csv.push("Title,Hours,Rate,Other Cost");

        document.querySelectorAll(`#${tableInfo.id} tbody tr`).forEach(row => {

            let titleCell = row.cells[0];

            let title =
                titleCell.querySelector("input") ?
                titleCell.querySelector("input").value :
                titleCell.innerText.trim();

            let hours = row.querySelector(".hours").value;
            let rate = row.querySelector(".rate").value;
            let other = row.querySelector(".otherCost").value;

            csv.push(
                `"${title}",${hours},${rate},${other}`
            );
        });

        csv.push("");
    });

    const blob = new Blob([csv.join("\n")], { type: "text/csv" });

    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "ROI_Data.csv";
    a.click();

    URL.revokeObjectURL(a.href);
}

function importCSV(event) {

    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {

        const text = e.target.result;
        const lines = text.split(/\r?\n/);

        const tableMap = {
            "#Manual Cost": "manualCostTable",
            "#Execution Cost": "executionCostTable",
            "#Development Cost": "devCostTable"
        };

        let currentTable = null;

        // Clear existing rows
        Object.values(tableMap).forEach(id => {
            document.querySelector(`#${id} tbody`).innerHTML = "";
        });

        for (let i = 0; i < lines.length; i++) {

            let line = lines[i].trim();

            if (line === "") continue;

            if (tableMap[line]) {
                currentTable = tableMap[line];
                i++; // Skip header row
                continue;
            }

            if (!currentTable) continue;

            const cols = parseCSV(line);

            addImportedRow(
                currentTable,
                cols[0],
                cols[1],
                cols[2],
                cols[3]
            );
        }

        calculateROI();

        event.target.value = "";
    };

    reader.readAsText(file);
}

function addImportedRow(tableId, title, hours, rate, otherCost) {

    const tbody = document.querySelector(`#${tableId} tbody`);

    const row = tbody.insertRow();

    row.innerHTML = `
        <td><label>${title}</label></td>
        <td><input class="hours" type="number" value="${hours}" oninput="calculateROI()"></td>
        <td><input class="rate" type="number" value="${rate}" oninput="calculateROI()"></td>
        <td><span class="calc">0</span></td>
        <td><input class="otherCost" type="number" value="${otherCost}" oninput="calculateROI()"></td>
        <td><button onclick="removeRow(this)">Remove</button></td>
    `;
}


function parseCSV(line) {

    const result = [];
    let current = "";
    let insideQuotes = false;

    for (let i = 0; i < line.length; i++) {

        const ch = line[i];

        if (ch === '"') {
            insideQuotes = !insideQuotes;
        }
        else if (ch === "," && !insideQuotes) {
            result.push(current);
            current = "";
        }
        else {
            current += ch;
        }
    }

    result.push(current);

    return result.map(x => x.trim());
}

// Add initial rows
//['manualCostTable', 'executionCostTable', 'devCostTable'].forEach(tableId => addRow(tableId, tableId.replace('CostTable', '').toLowerCase()));
addRow('manualCostTable', 'Datasetup','Datasetup');
addRow('manualCostTable', 'Manual Execution Effort','Manual Execution Effort');

addRow('executionCostTable', 'Automation execution monitoring','Automation execution monitoring');
addRow('executionCostTable', 'Datasetup Effort','Datasetup Effort');
addRow('executionCostTable', 'Automation result analysis effort','Automation result analysis effort');
addRow('executionCostTable', 'Tool administration','Tool administration');

addRow('devCostTable', 'Tool cost','Tool cost');
addRow('devCostTable', 'Script Development Effort','Script Development Effort');
addRow('devCostTable', 'Framework Development Effort','Framework Development Effort');
addRow('devCostTable', 'Automation POC Effort','Automation POC Effort');


calculateROI();
</script>
</div>
</body>
</html>
