<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Editor & Canvas</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            height: 100vh;
            box-sizing: border-box;
        }
        .container {
            display: flex;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }
        .section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        textarea {
            width: 100%;
            flex: 1;
            padding: 10px;
            box-sizing: border-box;
            resize: none;
        }
        .canvas-container {
            flex: 1;
            border: 1px solid #ccc;
            position: relative;
            background: #f9f9f9;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
    </style>
</head>
<body>

    <h1>Local Text & Canvas Editor</h1>

    <div class="container">
        <!-- Text Editor Section -->
        <div class="section">
            <h2>Text Editor</h2>
            <textarea id="textEditor" placeholder="Type your notes here... Auto-saves instantly."></textarea>
        </div>

        <!-- Canvas Drawing Section -->
        <div class="section">
            <h2>Canvas Drawing</h2>
            <div class="controls">
                <button id="clearCanvas">Clear Canvas</button>
                <input type="color" id="colorPicker" value="#000000">
                <input type="range" id="lineWidth" min="1" max="20" value="5">
            </div>
            <div class="canvas-container">
                <canvas id="paintCanvas"></canvas>
            </div>
        </div>
    </div>

    <script>
        // --- Text Editor Logic ---
        const textarea = document.getElementById('textEditor');
        
        // Load saved text
        textarea.value = localStorage.getItem('local_notes') || '';
        
        // Save text on input
        textarea.addEventListener('input', () => {
            localStorage.setItem('local_notes', textarea.value);
        });

        // --- Canvas Drawing Logic ---
        const canvas = document.getElementById('paintCanvas');
        const ctx = canvas.getContext('2d');
        const clearBtn = document.getElementById('clearCanvas');
        const colorPicker = document.getElementById('colorPicker');
        const lineWidthPicker = document.getElementById('lineWidth');

        let drawing = false;

        // Resize canvas to match its visual container size
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            loadCanvas();
        }

        // Draw logic
        function startDrawing(e) {
            drawing = true;
            draw(e);
        }

        function stopDrawing() {
            drawing = false;
            ctx.beginPath();
            saveCanvas();
        }

        function draw(e) {
            if (!drawing) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = (e.clientX || e.touches[0].clientX) - rect.left;
            const y = (e.clientY || e.touches[0].clientY) - rect.top;

            ctx.lineWidth = lineWidthPicker.value;
            ctx.lineCap = 'round';
            ctx.strokeStyle = colorPicker.value;

            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        // Storage logic for Canvas
        function saveCanvas() {
            localStorage.setItem('local_canvas', canvas.toDataURL());
        }

        function loadCanvas() {
            const dataURL = localStorage.getItem('local_canvas');
            if (dataURL) {
                const img = new Image();
                img.src = dataURL;
                img.onload = () => {
                    ctx.drawImage(img, 0, 0);
                };
            }
        }

        // Event Listeners for Drawing (Mouse & Touch)
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseleave', stopDrawing);

        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); });
        canvas.addEventListener('touchend', stopDrawing);
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); });

        // Clear Canvas
        clearBtn.addEventListener('click', () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            localStorage.removeItem('local_canvas');
        });

        // Initialize canvas sizing
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('DOMContentLoaded', resizeCanvas);
    </script>

</body>
</html>
